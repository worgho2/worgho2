name: Contributions

on:
  schedule:
    # Daily. An odd minute avoids the top-of-hour queue; GitHub may still run it late.
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/contributions.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The username is the repository owner, so a template copy renders its own graph without edits.
      # GREETING_TEXT is an optional repository variable (Settings > Secrets and variables > Actions).
      - name: Generate the SVG
        run: pnpm generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GREETING_TEXT: ${{ vars.GREETING_TEXT }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # GitHub disables scheduled workflows after 60 days without a push. Once a month, push one.
      - name: Keep the schedule alive
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Not the first day of the month; nothing to do."
            exit 0
          fi
          date -u +%Y-%m-%d > .keepalive
          if git diff --quiet -- .keepalive; then
            echo "Already pushed today; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keep the scheduled workflow alive"
          git push
